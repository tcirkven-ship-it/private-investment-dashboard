name: Generate Official Quarterly M1_B2 Model
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (validate only, do not write to Supabase)"
        type: boolean
        default: true
      quarter_label:
        description: "Quarter label (e.g. 2026-Q3)"
        type: string
        default: ""

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy pandas supabase

      - name: Run official M1_B2_QUALITY_VETO_N30 generator
        id: generate
        run: python scripts/generate_m1_b2_official.py

      - name: Validate output
        run: |
          CSV="outputs/quarterly/m1_b2_quality_veto_targets.csv"
          LINES=$(wc -l < "$CSV" | tr -d ' ')
          HOLDINGS=$((LINES - 1))
          echo "Holdings: $HOLDINGS"
          echo "Full 30 tickers:"
          tail -n +2 "$CSV" | cut -d, -f1 | tr '\n' ' '
          echo ""
          echo "Manifest:"
          cat outputs/quarterly/m1_b2_manifest.json 2>/dev/null || true
          if [ "$HOLDINGS" != "30" ]; then
            echo "ERROR: Expected 30 holdings, got $HOLDINGS"
            exit 1
          fi

      - name: Write to Supabase (if not dry run)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Writing validated M1_B2 model to Supabase..."
          python scripts/write_m1_b2_to_supabase.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m1-b2-quarterly-outputs
          path: |
            outputs/quarterly/m1_b2_quality_veto_targets.csv
            outputs/quarterly/m1_b2_manifest.json
          retention-days: 90

      - name: Summary
        run: |
          echo "=== M1_B2_QUALITY_VETO_N30 Generation Complete ==="
          HOLDINGS=$(tail -n +2 outputs/quarterly/m1_b2_quality_veto_targets.csv | wc -l | tr -d ' ')
          echo "Holdings: $HOLDINGS"
          echo "Dry run: ${{ github.event.inputs.dry_run }}"
          cat outputs/quarterly/m1_b2_manifest.json 2>/dev/null || true
