name: Inspection Safety
on:
  workflow_dispatch:
      - ".github/workflows/inspection-safety.yml"

jobs:
  forbid-destructive-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check hosted-readonly-inventory.sql for destructive commands
        run: |
          FORBIDDEN="\b(CREATE|ALTER|DROP|INSERT|UPDATE|DELETE|TRUNCATE|GRANT|REVOKE|RESET|MIGRATE|DO|CALL|EXECUTE)\b"
          FILE="supabase/sql/hosted-readonly-inventory.sql"
          if [ -f "$FILE" ]; then
            # Remove line comments (--), remove block comments (/* */), then scan
            # for forbidden SQL tokens on the remaining executable lines.
            # Using awk: print line number + stripped content, then grep.
            VIOLATIONS=$(awk '
              BEGIN { in_block = 0 }
              {
                line = $0
                # strip block comments spanning multiple lines
                if (in_block) {
                  if (line ~ /\*\//) {
                    sub(/.*\*\//, "", line)
                    in_block = 0
                  } else {
                    next
                  }
                }
                if (line ~ /\/\*/) {
                  sub(/\/\*.*/, "", line)
                  in_block = 1
                }
                # strip single-line comments
                sub(/--.*/, "", line)
                # skip blank lines
                if (line ~ /^[[:space:]]*$/) next
                print NR": "line
              }
            ' "$FILE")
            MATCHES=$(echo "$VIOLATIONS" | grep -iE "$FORBIDDEN" || true)
            if [ -n "$MATCHES" ]; then
              echo "ERROR: Found forbidden SQL commands in $FILE:"
              echo "$MATCHES"
              exit 1
            fi
            echo "OK: No forbidden destructive SQL found in $FILE"
          else
            echo "OK: $FILE not present in this PR"
          fi
