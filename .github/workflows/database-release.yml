name: Database Release Verification
on:
  pull_request:
    paths:
      - "web/supabase/migrations/**"
      - "web/scripts/**"
      - "web/src/lib/**"
      - "web/package.json"
      - "web/package-lock.json"
      - ".github/workflows/database-release.yml"
  push:
    branches: [main]

env:
  ALLOW_DESTRUCTIVE_DB_TESTS: "true"
  SUPABASE_CLI_VERSION: "2.6.1"

jobs:
  migration-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Hide migrations, start clean Supabase, restore migrations
        run: |
          mkdir -p /tmp/hidden-migrations
          mv supabase/migrations /tmp/hidden-migrations/ 2>/dev/null || true
          supabase start
          mv /tmp/hidden-migrations/migrations supabase/migrations
        working-directory: web
      - name: Get database URL
        run: |
          supabase status -o env | grep SUPABASE_DB_URL >> $GITHUB_ENV
      - name: Verify empty application schema
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public';" | grep "0"
      - name: Run migration smoke test
        run: EXPECTED_TEST_DATABASE=postgres bash scripts/test-migration.sh
        working-directory: web
        env:
          PG_TEST_URL: ${{ env.SUPABASE_DB_URL }}
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
        working-directory: web

  rollback-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Hide migrations, start clean Supabase, restore migrations
        run: |
          mkdir -p /tmp/hidden-migrations
          mv supabase/migrations /tmp/hidden-migrations/ 2>/dev/null || true
          supabase start
          mv /tmp/hidden-migrations/migrations supabase/migrations
        working-directory: web
      - name: Get database URL
        run: |
          supabase status -o env | grep SUPABASE_DB_URL >> $GITHUB_ENV
      - name: Verify empty application schema
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public';" | grep "0"
      - name: Run rollback test
        run: EXPECTED_TEST_DATABASE=postgres bash scripts/test-rollback.sh
        working-directory: web
        env:
          PG_TEST_URL: ${{ env.SUPABASE_DB_URL }}
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
        working-directory: web

  reset-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Hide migrations, start clean Supabase, restore migrations
        run: |
          mkdir -p /tmp/hidden-migrations
          mv supabase/migrations /tmp/hidden-migrations/ 2>/dev/null || true
          supabase start
          mv /tmp/hidden-migrations/migrations supabase/migrations
        working-directory: web
      - name: Get database URL
        run: |
          supabase status -o env | grep SUPABASE_DB_URL >> $GITHUB_ENV
      - name: Verify empty application schema
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public';" | grep "0"
      - name: Run reset test
        run: EXPECTED_TEST_DATABASE=postgres bash scripts/test-reset.sh
        working-directory: web
        env:
          PG_TEST_URL: ${{ env.SUPABASE_DB_URL }}
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
        working-directory: web

  auth-rls-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Start Supabase (migrations apply automatically)
        run: supabase start
        working-directory: web
      - name: Get Supabase environment
        run: |
          supabase status -o env > /tmp/supabase_env.txt
          while IFS= read -r line; do
            # Extract key-value from lines like: SUPABASE_ANON_KEY="..."
            key=$(echo "$line" | cut -d= -f1)
            val=$(echo "$line" | cut -d= -f2- | sed 's/^"//;s/"$//')
            if [ -n "$key" ]; then
              # Map to variable names the TypeScript test reads
              case "$key" in
                SUPABASE_URL) echo "NEXT_PUBLIC_SUPABASE_URL=$val" >> "$GITHUB_ENV" ;;
                SUPABASE_ANON_KEY) echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$val" >> "$GITHUB_ENV" ;;
                SUPABASE_SERVICE_ROLE_KEY) echo "SUPABASE_SERVICE_ROLE_KEY=$val" >> "$GITHUB_ENV" ;;
                SUPABASE_DB_URL) echo "PG_TEST_URL=$val" >> "$GITHUB_ENV" ;;
              esac
            fi
          done < /tmp/supabase_env.txt
      - name: Health check
        run: |
          echo "Checking Supabase services..."
          for i in $(seq 1 30); do
            db_ok=0; auth_ok=0; cli_ok=0
            psql "$PG_TEST_URL" -v ON_ERROR_STOP=1 -c "select 1;" > /dev/null 2>&1 && db_ok=1
            curl --fail --silent --show-error "${NEXT_PUBLIC_SUPABASE_URL}/auth/v1/health" > /dev/null 2>&1 && auth_ok=1
            supabase status > /dev/null 2>&1 && cli_ok=1
            if [ "$db_ok" = "1" ] && [ "$auth_ok" = "1" ] && [ "$cli_ok" = "1" ]; then
              echo "All services healthy"
              exit 0
            fi
            sleep 2
          done
          echo "FAIL: Services not healthy within 60s"
          supabase status || true
          exit 1
      - name: Run Auth and RLS tests
        run: npx --no-install tsx scripts/test-auth-rls.ts
        working-directory: web
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
        working-directory: web

  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Web unit tests
        run: npm test
        working-directory: web
      - name: Production build
        run: npm run build
        working-directory: web
