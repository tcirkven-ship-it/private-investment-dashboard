name: Database Release Verification
on:
  pull_request:
    paths:
      - "web/supabase/migrations/**"
      - "web/scripts/**"
      - "web/src/lib/**"
      - "web/package.json"
      - "web/package-lock.json"
      - ".github/workflows/database-release.yml"
  push:
    branches: [main]

env:
  ALLOW_DESTRUCTIVE_DB_TESTS: "true"
  SUPABASE_CLI_VERSION: "2.6.1"
  CI_SUPABASE_WORKDIR: "${{ runner.temp }}/supabase-ci-${{ github.job }}"

jobs:
  migration-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Print CLI version
        run: supabase --version
      - name: Create temp project dir and copy migrations
        run: |
          mkdir -p "$CI_SUPABASE_WORKDIR"
          # Copy only migrations (not the incompatible config.toml)
          cp -r supabase/migrations "$CI_SUPABASE_WORKDIR/supabase/migrations"
          # Hide migrations so supabase start doesn't apply them
          mv "$CI_SUPABASE_WORKDIR/supabase/migrations" /tmp/hidden-ci-migrations
        working-directory: web
      - name: Init and start Supabase
        run: |
          supabase init --workdir "$CI_SUPABASE_WORKDIR" --force
          supabase --workdir "$CI_SUPABASE_WORKDIR" start
        env:
          SUPABASE_CI: "true"
      - name: Get DB URL and export
        run: |
          supabase --workdir "$CI_SUPABASE_WORKDIR" status -o env | grep SUPABASE_DB_URL >> $GITHUB_ENV
      - name: Verify empty application schema
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -t -A -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public';" | grep "^0$"
      - name: Restore migrations for manual test
        run: |
          mkdir -p "$CI_SUPABASE_WORKDIR/supabase/migrations"
          cp -r /tmp/hidden-ci-migrations/* "$CI_SUPABASE_WORKDIR/supabase/migrations/"
      - name: Run migration smoke test
        run: EXPECTED_TEST_DATABASE=postgres bash scripts/test-migration.sh
        working-directory: web
        env:
          PG_TEST_URL: ${{ env.SUPABASE_DB_URL }}
      - name: Stop Supabase
        if: always()
        run: supabase --workdir "$CI_SUPABASE_WORKDIR" stop --no-backup

  rollback-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Print CLI version
        run: supabase --version
      - name: Create temp project dir
        run: |
          mkdir -p "$CI_SUPABASE_WORKDIR"
          cp -r supabase/migrations "$CI_SUPABASE_WORKDIR/supabase/migrations"
          mv "$CI_SUPABASE_WORKDIR/supabase/migrations" /tmp/hidden-ci-rollback
        working-directory: web
      - name: Init and start Supabase
        run: |
          supabase init --workdir "$CI_SUPABASE_WORKDIR" --force
          supabase --workdir "$CI_SUPABASE_WORKDIR" start
        env:
          SUPABASE_CI: "true"
      - name: Get DB URL
        run: |
          supabase --workdir "$CI_SUPABASE_WORKDIR" status -o env | grep SUPABASE_DB_URL >> $GITHUB_ENV
      - name: Verify empty
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -t -A -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public';" | grep "^0$"
      - name: Restore migrations
        run: |
          mkdir -p "$CI_SUPABASE_WORKDIR/supabase/migrations"
          cp -r /tmp/hidden-ci-rollback/* "$CI_SUPABASE_WORKDIR/supabase/migrations/"
      - name: Run rollback test
        run: EXPECTED_TEST_DATABASE=postgres bash scripts/test-rollback.sh
        working-directory: web
        env:
          PG_TEST_URL: ${{ env.SUPABASE_DB_URL }}
      - name: Stop Supabase
        if: always()
        run: supabase --workdir "$CI_SUPABASE_WORKDIR" stop --no-backup

  reset-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Print CLI version
        run: supabase --version
      - name: Create temp project dir
        run: |
          mkdir -p "$CI_SUPABASE_WORKDIR"
          cp -r supabase/migrations "$CI_SUPABASE_WORKDIR/supabase/migrations"
          mv "$CI_SUPABASE_WORKDIR/supabase/migrations" /tmp/hidden-ci-reset
        working-directory: web
      - name: Init and start Supabase
        run: |
          supabase init --workdir "$CI_SUPABASE_WORKDIR" --force
          supabase --workdir "$CI_SUPABASE_WORKDIR" start
        env:
          SUPABASE_CI: "true"
      - name: Get DB URL
        run: |
          supabase --workdir "$CI_SUPABASE_WORKDIR" status -o env | grep SUPABASE_DB_URL >> $GITHUB_ENV
      - name: Verify empty
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -t -A -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public';" | grep "^0$"
      - name: Restore migrations
        run: |
          mkdir -p "$CI_SUPABASE_WORKDIR/supabase/migrations"
          cp -r /tmp/hidden-ci-reset/* "$CI_SUPABASE_WORKDIR/supabase/migrations/"
      - name: Run reset test
        run: EXPECTED_TEST_DATABASE=postgres bash scripts/test-reset.sh
        working-directory: web
        env:
          PG_TEST_URL: ${{ env.SUPABASE_DB_URL }}
      - name: Stop Supabase
        if: always()
        run: supabase --workdir "$CI_SUPABASE_WORKDIR" stop --no-backup

  auth-rls-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Print CLI version
        run: supabase --version
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Create temp project dir with migrations
        run: |
          mkdir -p "$CI_SUPABASE_WORKDIR"
          cp -r supabase/migrations "$CI_SUPABASE_WORKDIR/supabase/migrations"
        working-directory: web
      - name: Init and start Supabase (migrations apply automatically)
        run: |
          supabase init --workdir "$CI_SUPABASE_WORKDIR" --force
          supabase --workdir "$CI_SUPABASE_WORKDIR" start
        env:
          SUPABASE_CI: "true"
      - name: Export env vars
        run: |
          supabase --workdir "$CI_SUPABASE_WORKDIR" status -o env > /tmp/supabase_env.txt
          while IFS= read -r line; do
            key=$(echo "$line" | cut -d= -f1)
            val=$(echo "$line" | cut -d= -f2- | sed 's/^"//;s/"$//')
            [ -z "$key" ] && continue
            case "$key" in
              SUPABASE_URL) echo "NEXT_PUBLIC_SUPABASE_URL=$val" >> "$GITHUB_ENV" ;;
              SUPABASE_ANON_KEY) echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$val" >> "$GITHUB_ENV" ;;
              SUPABASE_SERVICE_ROLE_KEY) echo "SUPABASE_SERVICE_ROLE_KEY=$val" >> "$GITHUB_ENV" ;;
              SUPABASE_DB_URL) echo "PG_TEST_URL=$val" >> "$GITHUB_ENV" ;;
            esac
          done < /tmp/supabase_env.txt
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            db_ok=0; auth_ok=0; cli_ok=0
            psql "$PG_TEST_URL" -v ON_ERROR_STOP=1 -c "select 1;" > /dev/null 2>&1 && db_ok=1
            curl --fail --silent --show-error "${NEXT_PUBLIC_SUPABASE_URL}/auth/v1/health" > /dev/null 2>&1 && auth_ok=1
            supabase --workdir "$CI_SUPABASE_WORKDIR" status > /dev/null 2>&1 && cli_ok=1
            [ "$db_ok" = "1" ] && [ "$auth_ok" = "1" ] && [ "$cli_ok" = "1" ] && echo "All healthy" && exit 0
            sleep 2
          done
          echo "FAIL: Services not healthy"
          supabase --workdir "$CI_SUPABASE_WORKDIR" status || true
          exit 1
      - name: Run Auth and RLS tests
        id: test-step
        continue-on-error: true
        run: npx --no-install tsx scripts/test-auth-rls.ts
        working-directory: web
      - name: Stop Supabase
        if: always()
        run: supabase --workdir "$CI_SUPABASE_WORKDIR" stop --no-backup
      - name: Check test result
        if: steps.test-step.outcome != 'success'
        run: exit 1

  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Web unit tests
        run: npm test
        working-directory: web
      - name: Production build
        run: npm run build
        working-directory: web
