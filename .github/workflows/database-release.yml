name: Database Release Verification
on:
  pull_request:
    paths:
      - "web/supabase/migrations/**"
      - "web/scripts/**"
      - "web/src/lib/supabase-queries.ts"
      - "web/package.json"
      - "web/package-lock.json"
      - ".github/workflows/database-release.yml"
  push:
    branches: [main]
    paths:
      - "web/supabase/migrations/**"
      - "web/scripts/**"

env:
  ALLOW_DESTRUCTIVE_DB_TESTS: "true"

jobs:
  database-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:16.6.0
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Migration smoke test
        run: bash scripts/test-migration.sh
        working-directory: web
        env:
          PG_TEST_URL: postgresql://postgres:postgres@localhost:5432/postgres
          EXPECTED_TEST_DATABASE: postgres

      - name: Rollback test
        run: bash scripts/test-rollback.sh
        working-directory: web
        env:
          PG_TEST_URL: postgresql://postgres:postgres@localhost:5432/postgres
          EXPECTED_TEST_DATABASE: postgres

      - name: Reset and reapply test
        run: bash scripts/test-reset.sh
        working-directory: web
        env:
          PG_TEST_URL: postgresql://postgres:postgres@localhost:5432/postgres
          EXPECTED_TEST_DATABASE: postgres

  auth-rls-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: |
          supabase start
          echo "Waiting for services..."
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:54321/health > /dev/null 2>&1; then
              echo "Supabase ready"
              break
            fi
            sleep 2
          done
        working-directory: web

      - name: Run Auth and RLS tests
        run: npx tsx scripts/test-auth-rls.ts
        working-directory: web
        env:
          ALLOW_DESTRUCTIVE_DB_TESTS: "true"

      - name: Stop local Supabase
        if: always()
        run: supabase stop
        working-directory: web

  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Web unit tests
        run: npm test
        working-directory: web
      - name: Production build
        run: npm run build
        working-directory: web
