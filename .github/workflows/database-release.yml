name: Database Release Verification
on:
  pull_request:
    paths:
      - "web/supabase/migrations/**"
      - "web/scripts/**"
      - "web/src/lib/**"
      - "web/package.json"
      - "web/package-lock.json"
      - ".github/workflows/database-release.yml"
  push:
    branches: [main]

env:
  SUPABASE_CLI_VERSION: "2.6.1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Initialize temp Supabase project with app migrations
        shell: bash
        run: |
          CI_DIR="$RUNNER_TEMP/supabase-ci-$GITHUB_JOB"
          echo "CI_DIR=$CI_DIR" >> "$GITHUB_ENV"
          mkdir -p "$CI_DIR"
          supabase init --workdir "$CI_DIR" --force
          test -f "$CI_DIR/supabase/config.toml"
          mkdir -p "$CI_DIR/supabase/migrations"
          cp "$GITHUB_WORKSPACE/web/supabase/migrations/"*.sql "$CI_DIR/supabase/migrations/"

      - name: Install psql
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Start local Supabase
        shell: bash
        run: supabase --workdir "$CI_DIR" start

      - name: Export environment
        shell: bash
        run: |
          supabase --workdir "$CI_DIR" status -o env > /tmp/supabase_env.txt
          while IFS= read -r line; do
            key=$(echo "$line" | cut -d= -f1)
            val=$(echo "$line" | cut -d= -f2- | sed 's/^"//;s/"$//')
            [ -z "$key" ] && continue
            case "$key" in
              SUPABASE_URL) echo "NEXT_PUBLIC_SUPABASE_URL=$val" >> "$GITHUB_ENV" ;;
              SUPABASE_ANON_KEY) echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$val" >> "$GITHUB_ENV" ;;
              SUPABASE_SERVICE_ROLE_KEY) echo "SUPABASE_SERVICE_ROLE_KEY=$val" >> "$GITHUB_ENV" ;;
              SUPABASE_DB_URL) echo "PG_TEST_URL=$val" >> "$GITHUB_ENV" ;;
            esac
          done < /tmp/supabase_env.txt

      - name: Health check
        shell: bash
        run: |
          echo "Checking services..."
          for i in $(seq 1 30); do
            db_ok=0; auth_ok=0; cli_ok=0
            psql "$PG_TEST_URL" -c "select 1;" > /dev/null 2>&1 && db_ok=1
            curl --fail --silent --show-error "${NEXT_PUBLIC_SUPABASE_URL}/auth/v1/health" > /dev/null 2>&1 && auth_ok=1
            supabase --workdir "$CI_DIR" status > /dev/null 2>&1 && cli_ok=1
            [ "$db_ok" = "1" ] && [ "$auth_ok" = "1" ] && [ "$cli_ok" = "1" ] && echo "All healthy" && exit 0
            sleep 2
          done
          echo "FAILED: Services not healthy within 60s"
          supabase --workdir "$CI_DIR" status || true
          exit 1

      - name: Run Auth and RLS tests
        shell: bash
        run: npx --no-install tsx scripts/test-auth-rls.ts
        working-directory: web

      - name: Web unit tests
        run: npm test
        working-directory: web

      - name: Production build
        run: npm run build
        working-directory: web

      - name: Stop Supabase
        if: always()
        shell: bash
        run: |
          if [ -n "$CI_DIR" ] && [ -f "$CI_DIR/supabase/config.toml" ]; then
            supabase --workdir "$CI_DIR" stop --no-backup
          else
            echo "Nothing to stop"
          fi
